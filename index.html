<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RefId Context Extractor — Exact Match After Colon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>RefId Context Extractor</h1>
      <p class="sub">Matches the <b>value after ":"</b> exactly (ignores key). Handles <code>"value"</code> and <code>"value",</code>. Highlights matches (sky blue).</p>

      <div class="row" style="margin-bottom:8px;">
        <div class="field" style="flex:2;">
          <label for="fileInput">Upload .txt file</label>
          <input type="file" id="fileInput" accept=".txt,text/plain" />
        </div>
        <div class="field" style="flex:1;">
          <label for="refId">Enter value to match (exact equals after “:”)</label>
          <input type="text" id="refId" placeholder="e.g., 1b63c207ff0e46c7baee19b529e46267" />
        </div>
      </div>

      <div class="row" style="margin-bottom:4px;">
        <div class="field" style="max-width:180px;">
          <label for="preLines">Lines above first match</label>
          <input type="number" id="preLines" min="0" value="100" />
        </div>
        <div class="field" style="max-width:180px;">
          <label for="postLines">Lines below last match</label>
          <input type="number" id="postLines" min="0" value="100" />
        </div>
        <div class="flags">
          <label><input type="checkbox" id="caseInsensitive" /> Case-insensitive match</label>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn" id="extractBtn">Extract Context</button>
        <button class="btn secondary" id="downloadBtn" disabled>Download (.txt)</button>
        <button class="btn ghost" id="selectAllBtn" disabled>Select All</button>
        <button class="btn ghost" id="copyBtn" disabled>Copy</button>
        <button class="btn ghost" id="dp1Btn" disabled>DP1</button>
        <button class="btn ghost" id="dp2Btn" disabled>DP2</button>
        <button class="btn ghost" id="dp3Btn" disabled>DP3</button>
        <button class="btn ghost" id="cp1Btn" disabled>CP1</button>
        <button class="btn ghost" id="cp2Btn" disabled>CP2</button>
        <button class="btn ghost" id="cp3Btn" disabled>CP3</button>
        <button class="btn ghost" id="fp1Btn" disabled>FP1</button>
        <button class="btn ghost" id="fp2Btn" disabled>FP2</button>
        <button class="btn ghost" id="fp3Btn" disabled>FP3</button>
        <button class="btn ghost" id="baBtn" disabled>BA</button>
        <span class="pill" id="statsPill">No file loaded</span>
      </div>

      <button class="btn ghost" id="clearBtn">Clear</button>

      <!-- FIXED-HEIGHT SCROLLABLE OUTPUT -->
      <div class="output-wrap">
        <pre id="output" tabindex="0" aria-label="Output panel. Click here and press Ctrl+A to select all."></pre>
      </div>

      <div class="footer">
        <div class="status" id="status">Waiting for file…</div>
        <div class="status">Runs locally • White background • Internal scroll.</div>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const refIdInput = document.getElementById('refId');
    const preLinesInput = document.getElementById('preLines');
    const postLinesInput = document.getElementById('postLines');
    const caseInsensitiveChk = document.getElementById('caseInsensitive');

    const extractBtn = document.getElementById('extractBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const clearBtn = document.getElementById('clearBtn');
    
    // Debit buttons
    const dp1Btn = document.getElementById('dp1Btn');
    const dp2Btn = document.getElementById('dp2Btn');
    const dp3Btn = document.getElementById('dp3Btn');
    
    // Credit buttons
    const cp1Btn = document.getElementById('cp1Btn');
    const cp2Btn = document.getElementById('cp2Btn');
    const cp3Btn = document.getElementById('cp3Btn');
    
    // Fees buttons
    const fp1Btn = document.getElementById('fp1Btn');
    const fp2Btn = document.getElementById('fp2Btn');
    const fp3Btn = document.getElementById('fp3Btn');
    
    // BA button
    const baBtn = document.getElementById('baBtn');

    const output = document.getElementById('output');
    const statusEl = document.getElementById('status');
    const statsPill = document.getElementById('statsPill');

    let fileText = '';
    let lines = [];

    function setStatus(text, type = 'info') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : '');
    }
    function updateStats() {
      if (!fileText) {
        statsPill.textContent = 'No file loaded';
        return;
      }
      statsPill.textContent = `Lines: ${lines.length.toLocaleString()} • Size: ${fileText.length.toLocaleString()} chars`;
    }
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      output.innerHTML = '';
      downloadBtn.disabled = true;
      selectAllBtn.disabled = true;
      copyBtn.disabled = true;
      dp1Btn.disabled = true;
      dp2Btn.disabled = true;
      dp3Btn.disabled = true;
      cp1Btn.disabled = true;
      cp2Btn.disabled = true;
      cp3Btn.disabled = true;
      fp1Btn.disabled = true;
      fp2Btn.disabled = true;
      fp3Btn.disabled = true;
      baBtn.disabled = true;

      if (!f) {
        setStatus('No file selected', 'err');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        fileText = e.target.result ?? '';
        lines = fileText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        setStatus(`Loaded: ${f.name}`, 'ok');
        updateStats();
      };
      reader.onerror = () => setStatus('Failed to read file', 'err');
      reader.readAsText(f);
    });

    // Parse the value after first colon (for matching + highlighting)
    function parseRightSide(line) {
      const idx = line.indexOf(':');
      if (idx === -1) return null;

      const left = line.slice(0, idx + 1);   // includes colon
      const rightRaw = line.slice(idx + 1);  // everything after colon, as-is

      // Build core value: trim -> remove trailing comma -> strip surrounding quotes
      let core = rightRaw.trim();
      if (core.endsWith(',')) core = core.replace(/\s*,\s*$/, '');
      if ((core.startsWith('"') && core.endsWith('"')) || (core.startsWith("'") && core.endsWith("'"))) {
        core = core.slice(1, -1);
      }

      // For rendering: preserve formatting around the value
      const leadingSpacesMatch = rightRaw.match(/^\s*/);
      const leading = leadingSpacesMatch ? leadingSpacesMatch[0] : '';
      let rest = rightRaw.slice(leading.length);
      let openQuote = '';
      let closeQuote = '';
      let value = '';
      let trailing = '';

      if (rest.startsWith('"') || rest.startsWith("'")) {
        openQuote = rest[0];
        rest = rest.slice(1);
        const q = openQuote;
        const pos = rest.lastIndexOf(q);
        if (pos >= 0) {
          value = rest.slice(0, pos);
          closeQuote = q;
          trailing = rest.slice(pos + 1);
        } else {
          value = rest; // no closing quote found; treat all as value
        }
      } else {
        const m = rest.match(/([^,]*)(.*)/);
        if (m) {
          value = (m[1] ?? '').trimEnd();
          trailing = m[2] ?? '';
        } else {
          value = rest.trimEnd();
        }
      }

      return { left, rightRaw, leading, openQuote, value, closeQuote, trailing, coreValue: core };
    }

    function equalsByMode(a, b, caseInsensitive) {
      return caseInsensitive ? a.toLowerCase() === b.toLowerCase() : a === b;
    }

    // Extract value from various tag formats (XML, JSON, etc.)
    function extractValueFromTag(input) {
      let value = input.trim();
      
      // Remove surrounding quotes (both single and double)
      if ((value.startsWith('"') && value.endsWith('"')) || 
          (value.startsWith("'") && value.endsWith("'"))) {
        value = value.slice(1, -1).trim();
      }
      
      // Try XML-like tags: <tag>value</tag> or <namespace:tag>value</namespace:tag>
      let match = value.match(/<[^>]+>([^<]+)<\/[^>]+>/);
      if (match) return match[1].trim();
      
      // Try JSON-like with double quotes: "key": "value" or "key":"value"
      match = value.match(/"[^"]+"\s*:\s*"([^"]+)"/);
      if (match) return match[1].trim();
      
      // Try JSON-like with single quotes: 'key': 'value' or 'key':'value'
      match = value.match(/'[^']+'\s*:\s*'([^']+)'/);
      if (match) return match[1].trim();
      
      // Try curly brace format: {key: "value"} or {key: 'value'}
      match = value.match(/{\s*[^:]+:\s*["']?([^"'}\n]+)["']?\s*}/);
      if (match) return match[1].trim();
      
      // Try square bracket format: [value] or ["value"]
      match = value.match(/\[\s*["']?([^"'\]\n]+)["']?\s*\]/);
      if (match) return match[1].trim();
      
      // If no tag format found, return original trimmed value
      return value;
    }

    extractBtn.addEventListener('click', () => {
      if (!fileText) {
        setStatus('Please upload a .txt file first.', 'err');
        return;
      }
      const query = extractValueFromTag(refIdInput.value ?? '');
      if (!query) {
        setStatus('Please enter a value to match (after “:”).', 'err');
        return;
      }

      const preN = Math.max(0, parseInt(preLinesInput.value || '100', 10));
      const postN = Math.max(0, parseInt(postLinesInput.value || '100', 10));
      const ci = caseInsensitiveChk.checked;

      let matchIndexes = [];
      for (let i = 0; i < lines.length; i++) {
        const info = parseRightSide(lines[i]);
        if (!info) continue;
        if (equalsByMode(info.coreValue, query, ci)) matchIndexes.push(i);
      }

      if (matchIndexes.length === 0) {
        setStatus('No exact value match found after “:” (quotes/commas handled).', 'err');
        output.innerHTML = '';
        downloadBtn.disabled = true;
        selectAllBtn.disabled = true;
        copyBtn.disabled = true;
        dp1Btn.disabled = true;
        dp2Btn.disabled = true;
        dp3Btn.disabled = true;
        cp1Btn.disabled = true;
        cp2Btn.disabled = true;
        cp3Btn.disabled = true;
        fp1Btn.disabled = true;
        fp2Btn.disabled = true;
        fp3Btn.disabled = true;
        baBtn.disabled = true;
        return;
      }

      const firstIndex = matchIndexes[0];
      const lastIndex = matchIndexes[matchIndexes.length - 1];
      const start = Math.max(0, firstIndex - preN);
      const end = Math.min(lines.length, lastIndex + postN + 1);

      // Render with highlight only around the core value (keep quotes/comma)
      let html = '';
      for (let i = start; i < end; i++) {
        const line = lines[i];
        const info = parseRightSide(line);
        if (!info) {
          html += escapeHtml(line) + '\n';
          continue;
        }
        const { left, leading, openQuote, value, closeQuote, trailing, coreValue } = info;

        if (equalsByMode(coreValue, query, ci)) {
          html +=
            escapeHtml(left) +
            escapeHtml(leading) +
            escapeHtml(openQuote) +
            '<span class="hl">' + escapeHtml(value) + '</span>' +
            escapeHtml(closeQuote) +
            escapeHtml(trailing) + '\n';
        } else {
          html += escapeHtml(line) + '\n';
        }
      }

      // Highlight all Debit Posting in red, Credit Posting in orange, Fees Posting in pink, and BATCH_ACCOUNTING in blue
      html = html.replace(/narration: Debit Posting/g, '<span class="hl-debit">narration: Debit Posting</span>');
      html = html.replace(/narration: Credit Posting/g, '<span class="hl-credit">narration: Credit Posting</span>');
      html = html.replace(/narration: Fees Posting/g, '<span class="hl-fees">narration: Fees Posting</span>');
      html = html.replace(/PAYMENTHUB_TEST\.BATCH_ACCOUNTING/g, '<span class="hl-ba">PAYMENTHUB_TEST.BATCH_ACCOUNTING</span>');

      output.innerHTML = html;
      output.focus();

      downloadBtn.disabled = false;
      selectAllBtn.disabled = false;
      copyBtn.disabled = false;
      
      // Enable posting buttons
      const debitMatches = output.querySelectorAll('.hl-debit').length;
      const creditMatches = output.querySelectorAll('.hl-credit').length;
      const feesMatches = output.querySelectorAll('.hl-fees').length;
      
      dp1Btn.disabled = debitMatches < 1;
      dp2Btn.disabled = debitMatches < 2;
      dp3Btn.disabled = debitMatches < 3;
      cp1Btn.disabled = creditMatches < 1;
      cp2Btn.disabled = creditMatches < 2;
      cp3Btn.disabled = creditMatches < 3;
      fp1Btn.disabled = feesMatches < 1;
      fp2Btn.disabled = feesMatches < 2;
      fp3Btn.disabled = feesMatches < 3;
      baBtn.disabled = !output.querySelector('.hl-ba');

      setStatus(
        `Found ${matchIndexes.length} matching line(s). Extracted lines ${start + 1}–${end} (${end - start} lines).`,
        'ok'
      );
    });

    // Download as plain text (no highlighting)
    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([output.textContent || ''], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      
      // Extract filename from logs (look for "fileName: T2750768.txt" pattern)
      let downloadFileName = `refid_context_${Date.now()}.txt`;
      const outputText = output.textContent || '';
      const fileNameMatch = outputText.match(/fileName:\s*(.+?)(?:\n|,|$)/i);
      if (fileNameMatch && fileNameMatch[1]) {
        let extractedName = fileNameMatch[1].trim().replace(/[",]/g, '');
        // Remove file extension
        extractedName = extractedName.replace(/\.[^.]+$/, '');
        if (extractedName) {
          downloadFileName = `ACH_${extractedName}_Logs.txt`;
        }
      }
      
      a.download = downloadFileName;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // Select all inside output panel
    selectAllBtn.addEventListener('click', () => {
      const range = document.createRange();
      range.selectNodeContents(output);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      output.focus();
    });

    // Copy (plain text)
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(output.textContent || '');
        setStatus('Copied to clipboard.', 'ok');
      } catch {
        setStatus('Clipboard copy failed. Try Ctrl+A, Ctrl+C.', 'err');
      }
    });

    // Helper function to navigate to specific match number
    function navigateToOccurrence(className, occurrenceNum, label) {
      const matches = Array.from(output.querySelectorAll(`.${className}`));
      if (matches.length === 0) {
        setStatus(`No "${label}" found in logs.`, 'err');
        return;
      }

      if (occurrenceNum > matches.length) {
        setStatus(`Only ${matches.length} "${label}" occurrence(s) found.`, 'err');
        return;
      }

      const highlight = matches[occurrenceNum - 1];
      highlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
      
      setStatus(`Navigated to ${label} (${occurrenceNum}/${matches.length})`, 'ok');
    }

    // Debit Posting navigation
    dp1Btn.addEventListener('click', () => navigateToOccurrence('hl-debit', 1, 'Debit Posting'));
    dp2Btn.addEventListener('click', () => navigateToOccurrence('hl-debit', 2, 'Debit Posting'));
    dp3Btn.addEventListener('click', () => navigateToOccurrence('hl-debit', 3, 'Debit Posting'));

    // Credit Posting navigation
    cp1Btn.addEventListener('click', () => navigateToOccurrence('hl-credit', 1, 'Credit Posting'));
    cp2Btn.addEventListener('click', () => navigateToOccurrence('hl-credit', 2, 'Credit Posting'));
    cp3Btn.addEventListener('click', () => navigateToOccurrence('hl-credit', 3, 'Credit Posting'));

    // Fees Posting navigation
    fp1Btn.addEventListener('click', () => navigateToOccurrence('hl-fees', 1, 'Fees Posting'));
    fp2Btn.addEventListener('click', () => navigateToOccurrence('hl-fees', 2, 'Fees Posting'));
    fp3Btn.addEventListener('click', () => navigateToOccurrence('hl-fees', 3, 'Fees Posting'));

    // Navigate to BA (BATCH_ACCOUNTING)
    baBtn.addEventListener('click', () => {
      const highlight = output.querySelector('.hl-ba');
      if (!highlight) {
        setStatus('No "PAYMENTHUB_TEST.BATCH_ACCOUNTING" found in logs.', 'err');
        return;
      }
      
      highlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setStatus('Scrolled to first Blue highlighted "BATCH_ACCOUNTING".', 'ok');
    });

    clearBtn.addEventListener('click', () => {
      output.innerHTML = '';
      refIdInput.value = '';
      preLinesInput.value = 100;
      postLinesInput.value = 100;
      caseInsensitiveChk.checked = false;
      setStatus('Cleared. Ready.');
      downloadBtn.disabled = true;
      selectAllBtn.disabled = true;
      copyBtn.disabled = true;
      dp1Btn.disabled = true;
      dp2Btn.disabled = true;
      dp3Btn.disabled = true;
      cp1Btn.disabled = true;
      cp2Btn.disabled = true;
      cp3Btn.disabled = true;
      fp1Btn.disabled = true;
      fp2Btn.disabled = true;
      fp3Btn.disabled = true;
      baBtn.disabled = true;
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
